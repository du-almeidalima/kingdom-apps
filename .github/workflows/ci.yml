name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/ci/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # Uncomment this line to enable task distribution
      # - run: npx nx-cloud start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="build"

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - uses: nrwl/nx-set-shas@v4

      # Prepend any command with "nx-cloud record --" to record its logs to Nx Cloud
      # - run: npx nx-cloud record -- echo Hello World
      # Nx Affected runs only tasks affected by the changes in this PR/commit. Learn more: https://nx.dev/ci/features/affected
      - run: npx nx affected -t test --no-cloud

  # E2E job: Playwright against the Firebase emulators. Deliberately NOT a
  # dependency of `deploy` — a flaky browser run must never block a release.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 22 matches `functions/ministry-maps` engines — the Functions
      # emulator refuses to boot on a mismatched runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # The Firestore and Auth emulators are Java processes.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - run: npm ci
      # Separate package.json/lockfile; the Functions emulator loads this codebase.
      - run: npm ci --prefix functions/ministry-maps
      - run: npm --prefix functions/ministry-maps run lint
      - run: npm --prefix functions/ministry-maps test
      - run: npm --prefix functions/ministry-maps run build

      - uses: nrwl/nx-set-shas@v4

      # Playwright strips types instead of checking them, so this is the only
      # thing that catches a spec that cannot possibly pass. Seconds, and it
      # runs before the expensive browser install.
      - run: npx nx typecheck-e2e ministry-maps --no-cloud

      - name: Cache Playwright browsers and Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/firebase/emulators
          key: e2e-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: e2e-binaries-${{ runner.os }}-

      - run: npx playwright install --with-deps chromium

      # Run the full suite for every CI invocation; unlike unit tests, this job
      # exists specifically to exercise the complete emulator-backed journey.
      - run: npx nx e2e ministry-maps --no-cloud

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # `logs/` is where the e2e stack supervisor (e2e-servers.mjs) writes
          # emulator + dev-server output; its failure banners point here, so a
          # red run must ship it for the pointer to be actionable.
          path: |
            dist/.playwright/apps/ministry-maps/playwright-report
            dist/.playwright/apps/ministry-maps/logs
          if-no-files-found: ignore
          retention-days: 7

  # Deploy job: runs only on pushes to the main branch and after the `main` job completes
  deploy:
    runs-on: ubuntu-latest
    needs: main
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - uses: nrwl/nx-set-shas@v4

      - name: Get projects with deploy target
        id: affected
        run: |
          echo "Finding projects with deploy target..."

          # Get all projects that have a deploy target configured
          PROJECTS_TO_DEPLOY=$(npx nx show projects --json | jq -r '.[] | select(.targets.deploy != null) | .name' 2>/dev/null || echo "")

          if [ -n "$PROJECTS_TO_DEPLOY" ]; then
            echo "Found projects with deploy target: $PROJECTS_TO_DEPLOY"
          else
            echo "No projects with deploy target found"
          fi

          echo "projects=$PROJECTS_TO_DEPLOY" >> $GITHUB_OUTPUT

      - name: Deploy affected projects
        if: steps.affected.outputs.projects != ''
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          NX_FIREBASE_PROJECT_ID: ${{ secrets.NX_FIREBASE_PROJECT_ID }}
          NX_FIREBASE_API_KEY: ${{ secrets.NX_FIREBASE_API_KEY }}
          NX_FIREBASE_APP_ID: ${{ secrets.NX_FIREBASE_APP_ID }}
          NX_FIREBASE_AUTH_DOMAIN: ${{ secrets.NX_FIREBASE_AUTH_DOMAIN }}
          NX_ENV: production
          NX_APP_BASE_URL: ${{ vars.NX_APP_BASE_URL }}
        run: |
          echo "Deploying projects: ${{ steps.affected.outputs.projects }}"
          for proj in ${{ steps.affected.outputs.projects }}; do
            echo "--> Deploying $proj"
            # Run the project's deploy target. Adjust --configuration if needed per-project.
            npx nx run "$proj":deploy --configuration=production
          done
