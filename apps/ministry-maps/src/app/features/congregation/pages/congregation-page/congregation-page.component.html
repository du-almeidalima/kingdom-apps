<main class="container pb-24">
  <header class="flex flex-wrap items-center justify-between gap-4 mb-6">
    <h2 class="t-headline2" data-testid="config-heading">Administrar Congregação</h2>
    <button
      lib-button
      btnType="primary"
      type="button"
      data-testid="config-add-congregation"
      *libAuthorize="[RoleEnum.APP_ADMIN]"
      (click)="handleOpenAddCongregationDialog()"
    >
      Adicionar Congregação
    </button>
  </header>

  @if (congregation(); as cong) {
    <div class="flex flex-col gap-6">
      <lib-card [customStyle]="cardStyle">
        <kingdom-apps-congregation-name-form
          [name]="cong.name"
          [disabled]="isLoading()"
          (saveName)="handleSaveCongregationName($event)"
        />
      </lib-card>

      <lib-card [customStyle]="cardStyle">
        <kingdom-apps-congregation-cities
          [cities]="cities()"
          [territoryCounts]="territoryCounts()"
          [disabled]="isLoading()"
          (addCity)="handleAddCity($event)"
          (renameCity)="handleRenameCity($event)"
          (reorderCities)="handleReorderCities($event)"
          (removeCity)="handleRemoveCity($event)"
        />
      </lib-card>
    </div>
  } @else {
    <div class="p-8 text-center rounded-lg border" data-testid="config-no-congregation-banner">
      <p class="t-body1">Nenhuma congregação encontrada. Verifique se você está autenticado.</p>
    </div>
  }
</main>
