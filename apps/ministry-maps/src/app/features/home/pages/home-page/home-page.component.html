<div class="container">
  <h2 class="t-headline2 mb-8" data-testid="home-heading">Bem-Vindo {{ userName }}!</h2>
  <!-- Territories -->
  <lib-card data-testid="home-card-territories" [customStyle]="{ padding: 0 }">
    <lib-card-header
      icon="task-list-lined"
      title="Designar Territórios"
      subtitle="Crie listas com territórios e compartilhe com os publicadores"
    ></lib-card-header>
    <lib-card-body>
      <ul class="card-body__link-list">
        <li class="card-body__link-list-item">
          <a
            class="card-body__link"
            routerLink="/{{ FeatureRoutes.TERRITORIES }}/{{ TerritoryRoutes.ASSIGN_TERRITORIES }}"
          >
            Designar Territórios
          </a>
        </li>
        <li class="card-body__link-list-item">
          <a class="card-body__link" routerLink="/{{ FeatureRoutes.TERRITORIES }}/{{ TerritoryRoutes.DESIGNATIONS_HISTORY }}">
            Histórico de Designações
          </a>
        </li>
        <li class="card-body__link-list-item">
          <a class="card-body__link" routerLink="/{{ FeatureRoutes.TERRITORIES }}/{{ TerritoryRoutes.LIST }}">
            Territórios
          </a>
        </li>
        <li class="card-body__link-list-item">
          <a class="card-body__link" routerLink="/{{ FeatureRoutes.TERRITORIES }}/{{ TerritoryRoutes.STATISTICS }}">
            Estatísticas
          </a>
        </li>
      </ul>
    </lib-card-body>
  </lib-card>
  <!-- Congregation -->
  <lib-card class="mt-5" data-testid="home-card-congregation" [customStyle]="{ padding: 0 }">
    <lib-card-header
      icon="user-29"
      title="Congregação"
      subtitle="Administrar congregação e publicadores"
    ></lib-card-header>
    <lib-card-body>
      <ul class="card-body__link-list">
        <li class="card-body__link-list-item">
          <a
            class="card-body__link"
            routerLink="/{{ FeatureRoutes.CONGREGATION }}/{{ CongregationRoutes.USERS }}"
          >
            Pessoas
          </a>
        </li>
        <li *libAuthorize="CONGREGATION_ALLOWED_ROLES" class="card-body__link-list-item">
          <a class="card-body__link" routerLink="/{{ FeatureRoutes.CONGREGATION }}">
            Congregação
          </a>
        </li>
      </ul>
    </lib-card-body>
  </lib-card>
</div>
