<main class="container flex flex-col gap-5 h-full">
  <!-- USER INFORMATION -->
  <lib-card [customStyle]="{ padding: '1.4rem' }">
    <div class="user-card">
      <figure class="user-initials-figure" data-testid="profile-initials">
        <figcaption>{{ initials() }}</figcaption>
      </figure>
      <div class="user-card__content">
        <div class="user-card__title-content">
          <h2 class="t-headline4 t-primary" data-testid="profile-name">{{ fullName() }}</h2>
          <span class="user-card__privilege-badge" data-testid="profile-role-badge">{{ role() }}</span>
        </div>
        <span class="t-body2 t-medium-emphasis" data-testid="profile-congregation-name">{{ congregation() }}</span>
      </div>
    </div>
  </lib-card>
  <!-- APPEARANCE SETTINGS -->
  <kingdom-apps-appearance-settings />

  <!-- PWA APP INSTALLATION -->
  <kingdom-apps-app-install-settings />

  <!-- NOTES BACKUP & EXPORT-->
  @if (false) {
    <lib-card>
      <h2 class="t-headline4 t-primary uppercase mb-5">Notas</h2>
      <h3 class="t-secondary t-body1">Exportar</h3>
    </lib-card>
  }
  <!-- APP ADMIN CHANGE CONGREGATION -->
  <kingdom-apps-change-congregation *libAuthorize="CHANGE_CONGREGATION_ALLOWED" />
  <!-- LOGOUT -->
  <button lib-button class="logout-button mt-auto mb-5" data-testid="profile-logout-button" (click)="handleLogOut()">
    <lib-icon icon="log-out-7" class="h-6 w-6" [fillColor]="'currentColor'"></lib-icon>
    SAIR
  </button>
</main>
