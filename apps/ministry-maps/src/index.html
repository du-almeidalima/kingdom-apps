<!doctype html>
<html lang="pt-br" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" data-mm-theme-color content="#E7E6E4" />
    <script>
      // Initialize the theming preferences
      (() => {
        try {
          const storageKey = 'ministry-maps.theme-preference';
          let pref = 'system';
          try {
            const stored = localStorage.getItem(storageKey);
            if (stored === 'system' || stored === 'light' || stored === 'dark') {
              pref = stored;
            }
          } catch {}

          let isDark = false;
          try {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch {}

          const resolved = pref === 'dark' || (pref === 'system' && isDark) ? 'dark' : 'light';

          const docEl = document.documentElement;
          docEl.setAttribute('data-theme', pref);
          docEl.setAttribute('data-resolved-theme', resolved);
          docEl.style.colorScheme = resolved;

          const meta = document.querySelector('meta[name="theme-color"][data-mm-theme-color]');
          if (meta) {
            meta.content = resolved === 'dark' ? '#121212' : '#E7E6E4';
          }
        } catch {}
      })();

      // Stop the browser default install prompt in favor of the custom one
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
      });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="google" content="notranslate" />
    <meta
      name="description"
      lang="en"
      content="Ministry Maps (MM) Web Application to help with the ministry work of the Jehovah Witnesses"
    />
    <meta
      name="description"
      lang="pt-br"
      content="Aplicativo Web Ministry Maps (MM) para ajudar com o serviço de pregação das Testemunhas de Jeová"
    />
    <title>Ministry Maps</title>
    <base href="/" />
    <link rel="preconnect" href="https://lh3.googleusercontent.com" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/ios/180.png" />
  </head>
  <body>
    <kingdom-apps-root>
      <main class="flex justify-center items-center" style="height: 100dvh">
        <!-- Spinner while the application is loading -->
        <div class="spinner">
          <div class="spinner__inner-block"></div>
        </div>
      </main>
    </kingdom-apps-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
